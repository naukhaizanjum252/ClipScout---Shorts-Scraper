<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#7c5cff"/>
  <!-- magnifier lens = "scout" -->
  <circle cx="14" cy="14" r="6.5" fill="none" stroke="#ffffff" stroke-width="2.5"/>
